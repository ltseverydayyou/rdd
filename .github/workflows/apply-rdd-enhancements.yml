name: Apply RDD Enhancements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Pages-relative cache path
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/js/rdd-enhancements.js")
          text = path.read_text(encoding="utf-8")
          old = 'const CACHE_URL = "../api/versions/index.json";'
          new = 'const CACHE_URL = "api/versions/index.json";'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("Could not locate RDD cache URL")

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/js/rdd-enhancements.js
            git commit -m "fix: resolve version cache from Pages root"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Patch already applied"
          fi
